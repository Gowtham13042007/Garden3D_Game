<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Data Garden 3D</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --s1: #aee0ef;
        --s2: #f7efd0;
        --s3: #b5d98f;
        --ink: #2d3a2a;
        --pan: #ffffffcc;
        --acc: #e8743b;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --s1: #14232e;
          --s2: #243628;
          --s3: #2c4325;
          --ink: #e9f0dc;
          --pan: #101c14d0;
        }
      }
      :root[data-theme="dark"] {
        --s1: #14232e;
        --s2: #243628;
        --s3: #2c4325;
        --ink: #e9f0dc;
        --pan: #101c14d0;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        font:
          500 15px/1.35 Fredoka,
          "Trebuchet MS",
          system-ui,
          sans-serif;
        color: var(--ink);
        background: linear-gradient(var(--s1), var(--s2) 55%, var(--s3));
        user-select: none;
        -webkit-user-select: none;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #stage canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      .chip,
      #coach,
      #info,
      .dock,
      .cd,
      .sheet,
      .card,
      #toast {
        background: var(--pan);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid #fff6;
        box-shadow: 0 6px 20px #0002;
      }
      .chip {
        border-radius: 99px;
        padding: 5px 13px;
        font: inherit;
        font-weight: 600;
        color: var(--ink);
        display: inline-block;
      }
      button {
        font: inherit;
        color: var(--ink);
        cursor: pointer;
      }
      #hud {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        max-width: 560px;
        margin: 0 auto;
        padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 0;
        pointer-events: none;
      }
      #hud .chip,
      #hud #coach {
        pointer-events: auto;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
      }
      #hud small {
        font-weight: 600;
        opacity: 0.7;
      }
      #hud h1 {
        margin: 0;
        font-size: 27px;
        font-weight: 600;
        line-height: 1.05;
        text-shadow: 0 1px 8px #fff8;
      }
      #hud button.chip {
        border: 1px solid #fff6;
        padding: 5px 11px;
      }
      .sm {
        margin-top: 6px;
        justify-content: flex-start;
      }
      #stars {
        letter-spacing: 2px;
        color: #e0a21c;
      }
      #coach {
        margin-top: 8px;
        border-radius: 18px;
        padding: 9px 12px;
        border-left: 6px solid var(--acc);
        cursor: pointer;
      }
      .pills {
        display: flex;
        gap: 4px;
        margin-bottom: 6px;
      }
      .pill {
        flex: 1;
        text-align: center;
        font-size: 10.5px;
        padding: 3px 0;
        border-radius: 99px;
        background: #0001;
        opacity: 0.6;
        transition: 0.3s;
      }
      .pill.on {
        background: var(--acc);
        color: #fff;
        opacity: 1;
        font-weight: 600;
      }
      .pill.dn {
        background: #4f9a5a;
        color: #fff;
        opacity: 0.9;
      }
      #cm {
        font-size: 13.5px;
      }
      #cm b {
        font-size: 15px;
      }
      #cm i {
        display: block;
        margin-top: 4px;
        font-size: 12px;
        opacity: 0.85;
      }
      #coach.min i {
        display: none;
      }
      #toast {
        position: fixed;
        left: 50%;
        top: 38%;
        transform: translate(-50%, 10px);
        opacity: 0;
        pointer-events: none;
        border-radius: 16px;
        padding: 9px 16px;
        max-width: 86vw;
        text-align: center;
        transition: 0.3s;
        z-index: 12;
      }
      #toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #bot {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        max-width: 560px;
        margin: 0 auto;
        padding: 0 12px calc(10px + env(safe-area-inset-bottom, 0px));
        pointer-events: none;
      }
      #bot > * {
        pointer-events: auto;
      }
      #info {
        border-radius: 16px;
        padding: 8px 12px;
        font-size: 13px;
        margin-bottom: 8px;
        border-left: 6px solid #4f9a5a;
      }
      .al {
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 2px 0;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2px 14px;
        margin: 4px 0;
      }
      .bar {
        flex: 1;
        height: 8px;
        border-radius: 9px;
        background: #0002;
        position: relative;
      }
      .bar u {
        position: absolute;
        top: 0;
        bottom: 0;
        border-radius: 9px;
        background: #5fae4a;
      }
      .dock {
        border-radius: 20px;
        padding: 6px 8px 8px;
      }
      .dl {
        font-size: 10.5px;
        opacity: 0.7;
        margin: 2px 4px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .r3 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(44px, 1fr));
        gap: 5px;
        margin-bottom: 4px;
      }
      .r3 button {
        background: #fff3;
        border: 2px solid transparent;
        border-radius: 14px;
        padding: 4px 0;
        font-size: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: 0.15s;
        min-width: 0;
      }
      .r3 button span {
        font-size: 25px;
        line-height: 1.15;
      }
      .r3 button.on {
        border-color: var(--acc);
        background: #fff6;
        transform: translateY(-3px);
      }
      .r3 button.fam span {
        border-bottom: 3px solid var(--c);
      }
      @keyframes pu {
        50% {
          box-shadow: 0 0 0 7px #e8743b66;
        }
      }
      .hl {
        animation: pu 1.1s infinite;
        border-color: var(--acc) !important;
      }
      .btn {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 16px;
        padding: 12px;
        font-size: 17px;
        width: 100%;
        margin-top: 6px;
        background: var(--acc);
        color: #fff;
        box-shadow: 0 4px 0 #b4501f;
        cursor: pointer;
        transition: transform 0.1s;
      }
      .btn:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #b4501f;
      }
      .btn:disabled {
        opacity: 0.45;
      }
      .btn.alt {
        background: #4f9a5a;
        box-shadow: 0 4px 0 #35703f;
      }
      .btn.ghost {
        background: #0001;
        color: var(--ink);
        box-shadow: none;
      }
      #lab,
      #res,
      #help,
      #intro {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0005;
        padding: 16px;
      }
      #res {
        align-items: flex-end;
        padding: 0;
      }
      #help {
        align-items: flex-end;
        padding: 0;
      }
      #lab[hidden],
      #res[hidden],
      #help[hidden],
      #intro[hidden] {
        display: none;
      }
      #intro {
        background: #0003;
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        z-index: 30;
      }
      .cd,
      .card {
        border-radius: 24px;
        padding: 18px;
        max-width: 400px;
        width: 100%;
        text-align: center;
        animation: rise 0.4s cubic-bezier(0.2, 1.3, 0.4, 1);
      }
      .card {
        max-height: 92vh;
        overflow: auto;
      }
      .cd .em {
        font-size: 52px;
      }
      .cd h3 {
        margin: 2px 0 6px;
        font-size: 22px;
      }
      .cd p {
        margin: 4px 0;
      }
      .cd i {
        display: block;
        font-size: 13px;
        opacity: 0.85;
        margin-top: 6px;
      }
      @keyframes rise {
        from {
          transform: translateY(30px) scale(0.9);
          opacity: 0;
        }
      }
      .sheet {
        width: 100%;
        max-width: 560px;
        border-radius: 26px 26px 0 0;
        padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
        max-height: 80vh;
        overflow: auto;
        animation: rise 0.45s both;
      }
      .sheet p {
        margin: 5px 0;
      }
      .bigstars {
        text-align: center;
      }
      .bigstars span {
        font-size: 52px;
        color: #0003;
        display: inline-block;
      }
      .bigstars .on {
        color: #f4b942;
        animation: pop 0.6s both;
        text-shadow: 0 0 18px #f4b94299;
      }
      @keyframes pop {
        0% {
          transform: scale(0) rotate(-40deg);
        }
        70% {
          transform: scale(1.35) rotate(8deg);
        }
        100% {
          transform: scale(1);
        }
      }
      .card .big {
        font-size: 62px;
      }
      .card h1 {
        margin: 0;
        font-size: 34px;
      }
      .how {
        list-style: none;
        padding: 0;
        margin: 12px 0;
        text-align: left;
      }
      .how li {
        display: flex;
        gap: 10px;
        align-items: center;
        background: #fff4;
        border-radius: 14px;
        padding: 7px 12px;
        margin: 5px 0;
        font-size: 14px;
      }
      .how em {
        font-size: 24px;
        font-style: normal;
      }
      .obj {
        text-align: left;
        font-size: 12.5px;
        background: #fff4;
        border-radius: 14px;
        padding: 8px 12px;
        margin: 8px 0;
      }
      .obj b {
        font-size: 13.5px;
      }
      .obj ul {
        margin: 4px 0 0;
        padding-left: 18px;
      }
      #hp {
        background: var(--s2);
        color: var(--ink);
        width: 100%;
        max-width: 560px;
        max-height: 88vh;
        overflow: auto;
        border-radius: 22px 22px 0 0;
        padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px));
      }
      #hp h2 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      .cc {
        background: var(--pan);
        border-radius: 14px;
        padding: 8px 12px;
        margin: 8px 0;
        font-size: 13.5px;
      }
      .cc u {
        display: block;
        text-decoration: none;
        color: var(--acc);
        font-weight: 600;
        margin-top: 2px;
      }
      #veil {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: linear-gradient(var(--s1), var(--s3));
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s;
        padding: 20px;
      }
      #veil.on {
        opacity: 1;
        pointer-events: auto;
      }
      #veil h2 {
        font-size: 40px;
        margin: 4px 0;
      }
      #veil p {
        max-width: 360px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud">
      <div class="row">
        <div>
          <small id="lv"></small>
          <h1 id="tt"></h1>
        </div>
        <div>
          <button class="chip" id="snd">🔊</button> <button class="chip" id="hpb">❓</button>
        </div>
      </div>
      <div class="row sm">
        <span class="chip" id="en"></span><span class="chip" id="stars"></span>
      </div>
      <div id="coach">
        <div class="pills"></div>
        <div id="cm"></div>
      </div>
    </div>
    <div id="toast"></div>
    <div id="bot">
      <div id="info" hidden></div>
      <div class="dock">
        <div class="dl">🔬 MEASURE · costs probes</div>
        <div class="r3" id="d1"></div>
        <div class="dl">🌱 PLANT</div>
        <div class="r3" id="d2"></div>
      </div>
      <button class="btn" id="go" disabled>🌤️ Grow season</button>
    </div>
    <div id="lab" hidden></div>
    <div id="res" hidden></div>
    <div id="help" hidden><div id="hp"></div></div>
    <div id="veil">
      <div>
        <small id="vl"></small>
        <h2 id="vt"></h2>
        <p id="vh"></p>
      </div>
    </div>
    <div id="intro"><div class="card" id="ic"></div></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      const $ = (s) => document.querySelector(s);
      const SP = [
        { n: "Sunflower", e: "🌻", i: [0.9, 0.5, 0.5, 0.6], t: [0.18, 0.3, 0.6, 0.5] },
        { n: "Cactus", e: "🌵", i: [0.9, 0.12, 0.6, 0.8], t: [0.25, 0.15, 0.5, 0.25] },
        { n: "Fern", e: "🌿", i: [0.2, 0.85, 0.4, 0.5], t: [0.2, 0.2, 0.3, 0.6] },
        { n: "Strawberry", e: "🍓", i: [0.65, 0.6, 0.3, 0.5], t: [0.3, 0.25, 0.15, 0.5] },
        { n: "Lavender", e: "🪻", i: [0.8, 0.25, 0.75, 0.6], t: [0.25, 0.25, 0.15, 0.3] },
        { n: "Mushroom", e: "🍄", i: [0.1, 0.6, 0.5, 0.3], t: [0.15, 0.3, 0.6, 0.2] },
      ];
      const FE = [
        { e: "☀️", n: "Sun", lo: "shady", hi: "sunny" },
        { e: "💧", n: "Water", lo: "dry", hi: "soggy" },
        { e: "🧪", n: "Soil pH", lo: "acidic", hi: "alkaline" },
        { e: "🌡️", n: "Warmth", lo: "cold", hi: "hot" },
      ];
      const LV = [
        {
          w: 5,
          ht: 4,
          k: 2,
          b: 10,
          sp: 4,
          an: 0,
          sa: 0.64,
          se: 0.55,
          sn: "morning sun",
          t: "Sunny Patch",
          h: "Goal: a garden full of happy plants. Score 50+ for ★, 70+ for ★★, 85+ for ★★★.",
          tip: "Next try: probe more tiles, or swap plants that struggled.",
        },
        {
          w: 5,
          ht: 5,
          k: 3,
          b: 14,
          sp: 5,
          an: 0,
          sa: -0.9,
          se: 0.75,
          sn: "noon sun",
          t: "Wild Corner",
          h: "Soil pH joins in. Coloured rings show plant families that help each other.",
          tip: "Plant same-ring friends side by side for a +7% growth bonus. Check each seed’s bars first: a wide green bar means that condition barely matters.",
        },
        {
          w: 5,
          ht: 5,
          k: 4,
          b: 16,
          sp: 6,
          an: 3,
          sa: 2.3,
          se: 0.45,
          sn: "afternoon sun",
          t: "Mystery Meadow",
          h: "Three tiles hide something odd that probes cannot see.",
          tip: "If a plant grows far better (✨) or worse (🐛) than predicted, it is an anomaly. Plant near blooms, avoid blights.",
        },
      ];
      // random sun direction on every page load; keeps the shadow trees off the pond/house and apart from each other
      (function () {
        const bad = (a) => {
          const x = Math.cos(a) * 6.5,
            z = Math.sin(a) * 6.5;
          return Math.hypot(x - 8.5, z + 1.2) < 3.4 || Math.hypot(x + 7.5, z + 6.5) < 3.4;
        };
        const used = [];
        LV.forEach((L) => {
          let a;
          do {
            a = Math.random() * Math.PI * 2;
          } while (
            bad(a) ||
            used.some((u) => Math.abs(Math.atan2(Math.sin(a - u), Math.cos(a - u))) < 0.9)
          );
          used.push(a);
          L.sa = a;
          L.sn = "sun at " + (Math.round((a * 180) / Math.PI) % 360) + "°";
        });
      })();
      const OBJ = [
        "Explain why we <b>sample</b> instead of measuring everything",
        "Read a model’s <b>prediction</b> and its <b>error</b>",
        "Choose which <b>features</b> are worth measuring",
        "Use <b>clusters</b> and <b>anomalies</b> to make better decisions",
      ];
      const CON = {
        sampling: [
          "🔬",
          "Sampling",
          "You cannot measure every tile. A small sample stands in for the whole garden.",
          "You do not know something and measuring everything is too costly. Probe a few spread-out tiles first.",
        ],
        regression: [
          "📈",
          "Prediction (regression-style model)",
          "The tile colours are a model’s prediction of growth from the conditions and each plant’s needs. Where you have not probed, the model guesses from nearby probes (shown with ~), a simple interpolation. Real regression would fit these relationships from data.",
          "You must choose before you can see the outcome. Pick a seed and read the % on each tile.",
        ],
        error: [
          "📏",
          "Model error",
          "Prediction versus reality: the average gap is the mean absolute error. Lower is a better model. A model checked only on the tiles it was built from can look better than it really is.",
          "After each season. A big gap means probe more, especially the tiles where you planted.",
        ],
        feature: [
          "🎯",
          "Feature selection",
          "Each condition is a feature. A wide green band means the plant ignores it, so probing it wastes budget.",
          "Your probes are limited. Probe only the conditions that the plants you want actually care about.",
        ],
        cluster: [
          "🧩",
          "Clustering (k-means)",
          "Nobody told the game which plants are friends. K-means grouped them by their needs. Same ring colour means same cluster, and neighbours in a cluster grow 7% better.",
          "You have many items and want natural groups. Here: choose which plants to put side by side.",
        ],
        anomaly: [
          "🚨",
          "Anomaly detection",
          "After the season each plant is compared with its prediction. A gap far beyond the usual spread (3 × MAD) is flagged: a bloom ✨ or blight 🐛 the model could not see.",
          "Something behaves unlike the rest. Use it to find hidden causes, good or bad.",
        ],
      };
      const WHEN = [
        ["I do not know a tile’s soil", "sampling"],
        ["I must guess tiles I have not probed", "regression"],
        ["Is my model any good?", "error"],
        ["Which conditions are worth probing?", "feature"],
        ["Which plants go together?", "cluster"],
        ["Why did a plant surprise me?", "anomaly"],
      ];
      const FAM = ["#f4b942", "#5bb0e0", "#d57fc5"],
        S = [0, 0, 0],
        seen = {},
        Q = [];
      const cl = (v, a, b) => Math.max(a, Math.min(b, v));
      function rng(a) {
        return () => {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const fam = (() => {
        let C = [SP[0].i, SP[2].i, SP[4].i].map((v) => v.slice()),
          a = [];
        for (let r = 0; r < 9; r++) {
          a = SP.map((s) => {
            let b = 0,
              d = 9;
            C.forEach((c, k) => {
              const q = c.reduce((u, v, j) => u + (v - s.i[j]) ** 2, 0);
              if (q < d) {
                d = q;
                b = k;
              }
            });
            return b;
          });
          C = C.map((c, k) => {
            const m = SP.filter((_, q) => a[q] == k);
            return m.length ? c.map((_, j) => m.reduce((u, s) => u + s.i[j], 0) / m.length) : c;
          });
        }
        return a;
      })();
      const fit = (s, f, k) => {
        let p = 1;
        for (let j = 0; j < k; j++) {
          const z = (f[j] - SP[s].i[j]) / SP[s].t[j];
          p *= Math.exp(-0.5 * z * z);
        }
        return Math.pow(p, 1 / k);
      };
      const med = (a) => {
        const s = [...a].sort((x, y) => x - y);
        return s[s.length >> 1];
      };
      // ---------- feel: sound, haptics, toast ----------
      let AC,
        mute = false;
      const ac = () => {
        try {
          AC = AC || new AudioContext();
          AC.resume();
        } catch (e) {}
      };
      function snd(f, d = 0.14, ty = "sine", v = 0.07, dl = 0) {
        if (mute || !AC) return;
        try {
          const t = AC.currentTime + dl,
            o = AC.createOscillator(),
            g = AC.createGain();
          o.type = ty;
          o.frequency.setValueAtTime(f, t);
          g.gain.setValueAtTime(v, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + d);
          o.connect(g).connect(AC.destination);
          o.start(t);
          o.stop(t + d);
        } catch (e) {}
      }
      const buzz = (n) => {
        try {
          navigator.vibrate && navigator.vibrate(n);
        } catch (e) {}
      };
      function toast(m, ms = 2200) {
        const t = $("#toast");
        t.textContent = m;
        t.classList.add("on");
        clearTimeout(toast.t);
        toast.t = setTimeout(() => t.classList.remove("on"), ms);
      }
      $("#snd").onclick = () => {
        mute = !mute;
        $("#snd").textContent = mute ? "🔇" : "🔊";
        ac();
      };

            t.p = { s: +k[1], done: 0, g: 0, pd: pred(i, +k[1])[0] };
            burst(t.x, 0.3, t.z, 0x8fe07a, 10);
            snd(300, 0.12, "triangle", 0.09);
            snd(450, 0.1, "triangle", 0.07, 0.07);
            buzz(15);
          });
        } else if (k == "x") {
          if (!t.p) return;
          t.pend = 1;
          job(i, () => {
            burst(t.x, 0.4, t.z, 0xb08050, 6);
            snd(180, 0.1, "triangle");
            t.p = null;
          });
        }
        paintAll();
      }
      function grow() {
        ac();
        G.season++;
        G.busy = 1;
        $("#res").hidden = 1;
        const k = G.L.k,
          r = [];
        G.g.forEach((t, i) => {
          if (!t.p) return;
          const c =
            nb(i).filter((q) => G.g[q].p && fam[G.g[q].p.s] == fam[t.p.s]).length *
            (G.l ? 0.07 : 0);
          const ex = fit(t.p.s, t.f, k) * (1 + c);
          const raw = ex + t.an + (Math.random() - 0.5) * 0.1;
          t.p.g = cl(raw, 0, 1);
          t.p.r = raw - ex;
          r.push(i);
        });
        const rs = r.map((i) => G.g[i].p.r),
          m = med(rs),
          mad = med(rs.map((x) => Math.abs(x - m))) * 1.48 + 0.03;
        r.forEach((i) => {
          const t = G.g[i];
          t.p.done = 0;
          if (t.an && Math.abs(t.p.r - m) > Math.max(0.15, 3 * mad)) t.found = 1;
        });
        $("#go").disabled = true;
        toast("🌤️ The season begins…", 1400);
        r.forEach((i, n) =>
          setTimeout(
            () => {
              const t = G.g[i],
                g = t.p.g;
              t.p.done = 1;
              paint(i);
              burst(
                t.x,
                0.7,
                t.z,
                g < 0.2 ? 0x8a6a40 : g > 0.7 ? 0xffe066 : 0x8fe07a,
                g < 0.2 ? 4 : 12,
              );
              snd(
                g < 0.2 ? 150 : 300 + g * 600,
                0.2,
                g < 0.2 ? "sawtooth" : "triangle",
                g < 0.2 ? 0.03 : 0.06,
              );
              if (t.found) {
                burst(t.x, 1.2, t.z, t.an > 0 ? 0xff9be8 : 0x9a6aff, 22);
                snd(t.an > 0 ? 1200 : 100, 0.3, "sine", 0.07);
                buzz(25);
              }
            },
            n * 110 + 300,
          ),
        );
        setTimeout(() => report(r), r.length * 110 + 900);
      }
      function report(r) {
        const sum = r.reduce((u, i) => u + G.g[i].p.g, 0),
          n = new Set(r.map((i) => G.g[i].p.s)).size;
        const sc = scoreOf(sum, n),
          st = stars(sc);
        S[G.l] = Math.max(S[G.l], st);
        const ok = r.filter((i) => !G.g[i].found),
          mae = ok.length
            ? Math.round(
                (100 * ok.reduce((u, i) => u + Math.abs(G.g[i].p.g - G.g[i].p.pd), 0)) / ok.length,
              )
            : 0;
        G.mae = mae;
        G.rv = 1;
        G.busy = 0;
        G.ch = st ? 2.2 : 0;
        const bad = r
          .filter((i) => G.g[i].p.g < 0.55 && !G.g[i].found)
          .sort((a, b) => G.g[a].p.g - G.g[b].p.g)
          .slice(0, 3)
          .map((i) => {
            const t = G.g[i],
              s = SP[t.p.s];
            let w = 0,
              wz = 0;
            for (let j = 0; j < G.L.k; j++) {
              const z = (t.f[j] - s.i[j]) / s.t[j];
              if (Math.abs(z) > Math.abs(wz)) {
                wz = z;
                w = j;
              }
            }
            return `<p>${s.e} struggled: the spot was too ${wz < 0 ? FE[w].lo : FE[w].hi} (${FE[w].e}${Math.round(t.f[w] * 100)}). Move or swap it.</p>`;
          })
          .join("");
        const fd = G.g.filter((t) => t.found).length,
          res = $("#res"),
          last = G.l == 2;
        res.hidden = 0;
        res.innerHTML = `<div class="sheet"><div class="bigstars">${[0, 1, 2].map((q) => `<span class="${q < st ? "on" : ""}" style="animation-delay:${q * 0.3 + 0.2}s">★</span>`).join("")}</div><div style="text-align:center;font-size:20px;font-weight:600">Season ${G.season}: score ${sc}</div><p>📏 Predictions were off by ${mae}% on average.</p>${bad || "<p>Nothing is struggling. Nice reading of the data.</p>"}${G.L.an ? `<p>Anomalies found: ${fd} of ${G.L.an}. Use blooms ✨, avoid blights 🐛.</p>` : ""}${st ? "" : "<p>Need 50+ for a star. Plant more tiles, and match seeds to probed conditions.</p>"}${st ? `<button class="btn alt" id="nx">${last ? "Finish the garden 🌳" : "Next level →"}</button>` : ""}<button class="btn ghost" id="cx">${st ? "Keep tweaking" : "Try again"}</button></div>`;
        $("#cx").onclick = () => (res.hidden = 1);
        if (st) $("#nx").onclick = () => (last ? end() : go(G.l + 1));
        res.onclick = (e) => {
          if (e.target === res) res.hidden = 1;
        };
        if (st) {
          [0, 1, 2]
            .slice(0, st)
            .forEach((q) => snd([523, 659, 784][q], 0.35, "triangle", 0.08, q * 0.2 + 0.2));
          buzz([20, 40, 20]);
          r.forEach((i, q) =>
            setTimeout(
              () => burst(G.g[i].x, 1, G.g[i].z, [0xf4b942, 0xff9be8, 0x7fd0ff][q % 3], 6),
              q * 40,
            ),
          );
        }
        paintAll();
        stars_();
        teach("error");
        if (fd) teach("anomaly");
      }
      function end() {
        $("#res").hidden = 1;
        const t = S.reduce((a, b) => a + b, 0);
        card(
          `<div class="big">🌳</div><h1>Your garden thrives</h1><p>${t} of 9 stars. Concepts you practised:</p><ul class="how" style="max-height:44vh;overflow:auto">${Object.values(
            CON,
          )
            .map(
              (c) =>
                `<li><em>${c[0]}</em><span><b>${c[1]}</b><br><small>Use when: ${c[3]}</small></span></li>`,
            )
            .join("")}</ul><button class="btn" id="st">Play again</button>`,
        );
        [523, 659, 784, 1047].forEach((f, q) => snd(f, 0.4, "triangle", 0.08, q * 0.15));
        $("#st").onclick = () => {
          Object.keys(seen).forEach((k) => delete seen[k]);
          S.fill(0);
          $("#intro").hidden = 1;
          go(0);
        };
      }
      $("#go").onclick = grow;
      function frame(t) {
        T = t / 1000;
        const dt = Math.min(0.05, T - lt);
        lt = T;
        requestAnimationFrame(frame);
        if (!G) return;
        if (!G.touched) az += 0.0025;
        dist += (dT - dist) * 0.05;
        cam.position.set(
          dist * Math.cos(el) * Math.sin(az),
          dist * Math.sin(el),
          dist * Math.cos(el) * Math.cos(az),
        );
        cam.lookAt(0, 0, 0);
        const ht = hov >= 0 && G.tool && G.g[hov];
        cur.visible = !!ht;
        if (ht) {
          cur.position.set(ht.x, 0.2, ht.z);
          cur.scale.setScalar(1 + Math.sin(T * 8) * 0.06);
        }
        G.g.forEach((t, i) => {
          t.mesh.position.y += ((i == hov ? 0.08 : 0) - t.mesh.position.y) * 0.25;
          if (t.pm) {
            t.cv += (t.ts - t.cs) * 0.16;
            t.cv *= 0.78;
            t.cs += t.cv;
            t.pm.scale.setScalar(Math.max(0.01, t.cs));
            if (!t.pm.userData.w) t.pm.rotation.z = Math.sin(T * 1.4 + t.x * 2) * 0.05;
          }
          if (t.found) t.fs.position.y = 1.5 + Math.sin(T * 3) * 0.08;
        });
        sway.forEach(([g, p]) => (g.rotation.z = Math.sin(T * 0.9 + p) * 0.025));
        gard(dt);
        for (let n = 0; n < FN; n++) {
          const f = fb[n];
          fp[n * 3] = f[0] + Math.sin(T * 0.5 + f[3]) * 0.6;
          fp[n * 3 + 1] = f[1] + Math.sin(T * 0.9 + f[3] * 2) * 0.3;
          fp[n * 3 + 2] = f[2] + Math.cos(T * 0.4 + f[3]) * 0.6;
        }
        fg.attributes.position.needsUpdate = true;
        for (let i = 0; i < BN; i++) {
          if (bl[i] > 0) {
            bl[i] -= dt * 0.9;
            bv[i * 3 + 1] -= dt * 2.4;
            for (let a = 0; a < 3; a++) bp[i * 3 + a] += bv[i * 3 + a] * dt;
            const l = Math.max(0, bl[i]);
            for (let a = 0; a < 3; a++) bc[i * 3 + a] = bb[i * 3 + a] * l;
            if (l <= 0) bp[i * 3 + 1] = -99;
          }
        }
        bg.attributes.position.needsUpdate = bg.attributes.color.needsUpdate = true;
        clouds.forEach((c) => {
          c.position.x += dt * 0.25;
          if (c.position.x > 14) c.position.x = -14;
        });
        R3.render(scene, cam);
      }
      load(0);
      intro();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
